<style>
/* Registering the angle as a typed property lets the browser animate it smoothly. It inherits, so the
   one animation on .ebi-pricing turns every gradient border inside it in step. @property and
   @keyframes names are page-wide, not scoped to the widget, so both carry the ebi prefix. */
@property --ebi-angle {
  syntax: "<angle>";
  inherits: true;
  initial-value: 0deg;
}

@keyframes ebi-pricing-spin {
  to {
    --ebi-angle: 360deg;
  }
}

.ebi-pricing {
  --ebi-accent: var(--color-accent, #FF5555);
  --ebi-border: var(--border-color, #4B4B4B);
  --ebi-radius: var(--radius-none, 0);
  --ebi-gap: var(--space-4, 16px);
  --ebi-total: #4ADE80;
  --ebi-notice: #60A5FA;
  --ebi-frame: 1px;
  /* Fluid type: each size grows with the viewport from 390px to 1440px, then stops. The rem part keeps
     it responding to the browser's text-size setting. */
  --ebi-text-caption: clamp(0.8125rem, 0.789rem + 0.095vw, 0.875rem);
  --ebi-text-small: clamp(0.9375rem, 0.914rem + 0.095vw, 1rem);
  --ebi-text-body: clamp(1rem, 0.954rem + 0.19vw, 1.125rem);
  --ebi-text-large: clamp(1.1875rem, 1.118rem + 0.286vw, 1.375rem);
  --ebi-text-title: clamp(1.625rem, 1.439rem + 0.762vw, 2.125rem);
  box-sizing: border-box;
  /* Fill the container, never shrink to fit the content, so ticking a box cannot change the width. */
  width: 100%;
  max-width: 1100px;
  padding: var(--space-5, 24px);
  border: var(--border-width, 1px) solid var(--ebi-border);
  border-radius: var(--ebi-radius);
  background: var(--surface-card, #0E0E0E);
  /* Turns --ebi-angle once every 3 seconds. The boxes the visitor can fill in or tick draw their
     gradient borders from it (see the rule after .ebi-pricing__cell--empty). */
  animation: ebi-pricing-spin 3s linear infinite;
  color: var(--text-body, #FFFFFF);
  font-size: var(--ebi-text-body);
  line-height: var(--lh-body, 1.6);
}

@media (prefers-reduced-motion: reduce) {
  .ebi-pricing {
    animation: none;
  }
}

.ebi-pricing *,
.ebi-pricing *::before,
.ebi-pricing *::after {
  box-sizing: inherit;
}

.ebi-pricing__title {
  margin: 0 0 var(--ebi-gap);
  font-size: var(--ebi-text-title);
  font-weight: var(--fw-bold, 700);
  line-height: var(--lh-heading, 1.2);
  letter-spacing: var(--ls-heading, 0.01em);
  color: var(--text-heading, #FFFFFF);
}

.ebi-pricing__form {
  display: grid;
  gap: var(--ebi-gap);
}

.ebi-pricing__field {
  display: grid;
  gap: var(--space-1, 4px);
  font-size: var(--ebi-text-small);
  font-weight: var(--fw-medium, 500);
}

.ebi-pricing__field input {
  width: 100%;
  padding: var(--space-2, 8px) var(--space-3, 12px);
  border-radius: var(--ebi-radius);
  color: var(--text-body, #FFFFFF);
  font: inherit;
  /* Never below 1rem: phone browsers zoom the page when you focus a field with smaller text. */
  font-size: max(1rem, var(--ebi-text-small));
  font-weight: var(--fw-regular, 400);
}

.ebi-pricing__field input:focus {
  outline: none;
  border-color: var(--ebi-accent);
  box-shadow: inset 0 0 0 1px var(--ebi-accent);
}

.ebi-pricing__check {
  display: flex;
  align-items: center;
  gap: var(--space-2, 8px);
}

.ebi-pricing__check input[type="checkbox"],
.ebi-pricing__check input[type="radio"] {
  flex: none;
  accent-color: var(--ebi-accent);
}

/* The standard pages: a fixed grid of two columns by three rows. Every cell is the same size, so how
   long a label is, or whether a box is ticked, never changes a cell. The four pages fill the first four
   cells; the last two are empty placeholders. To get three columns by two rows instead, change the 2
   below to 3. */
.ebi-pricing__cells {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 1fr;
  gap: var(--space-2, 8px);
}

.ebi-pricing__cell {
  min-width: 0;
  min-height: 2.75rem;
  padding: var(--space-2, 8px) var(--space-3, 12px);
  border: var(--border-width, 1px) solid var(--ebi-border);
  border-radius: var(--ebi-radius);
}

.ebi-pricing__cell--empty {
  border-style: dashed;
  opacity: 0.5;
}

/* Gradient border for the boxes the visitor interacts with: the number fields and the tick cells. The
   border is transparent, the box colour is painted inside the padding box, and a spinning conic gradient
   behind it shows through the border. The empty placeholder cells are not interactive, so they keep a
   plain dashed border. A focused number field switches to a solid accent border (see :focus above). */
.ebi-pricing__field input,
.ebi-pricing__check {
  border: var(--ebi-frame) solid transparent;
  background:
    linear-gradient(var(--ebi-fill), var(--ebi-fill)) padding-box,
    conic-gradient(
      from var(--ebi-angle, 0deg),
      var(--ebi-accent),
      var(--ebi-total),
      var(--ebi-notice),
      var(--ebi-accent)
    ) border-box;
}

.ebi-pricing__field input {
  --ebi-fill: var(--surface-input, #161616);
}

.ebi-pricing__check {
  --ebi-fill: var(--surface-card, #0E0E0E);
}

.ebi-pricing__hint {
  font-size: var(--ebi-text-caption);
  color: var(--text-muted, #B8B8B8);
}

.ebi-pricing__group {
  display: grid;
  gap: var(--space-2, 8px);
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.ebi-pricing__legend {
  padding: 0;
  font-size: var(--ebi-text-caption);
  font-weight: var(--fw-semibold, 600);
  letter-spacing: var(--ls-caps, 0.06em);
  text-transform: uppercase;
}

.ebi-pricing__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: var(--ebi-gap);
}

/* Selections on the left, quote on the right. Each side wants at least 400px; when the widget is
   too narrow for two columns (a phone or a portrait tablet) they wrap and stack, so no breakpoint
   is needed. */
.ebi-pricing__layout {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  column-gap: 2vw;
  row-gap: var(--ebi-gap);
}

.ebi-pricing__form,
.ebi-pricing__result {
  flex: 1 1 400px;
  min-width: 0;
}

.ebi-pricing__result {
  padding: var(--ebi-gap);
  border: var(--border-width, 1px) solid var(--ebi-border);
  border-top: var(--separator, 1px solid var(--ebi-accent));
}

.ebi-pricing__summary {
  margin: 0 0 var(--space-2, 8px);
  color: var(--text-muted, #B8B8B8);
}

.ebi-pricing__notice {
  margin: var(--ebi-gap) 0 0;
  padding: var(--space-3, 12px);
  border-left: var(--border-width-lg, 4px) solid var(--ebi-notice);
  background: var(--surface-input, #161616);
  color: var(--ebi-notice);
  font-weight: var(--fw-semibold, 600);
}

.ebi-pricing__rows {
  margin: 0;
  padding: 0;
  list-style: none;
}

.ebi-pricing__row {
  display: flex;
  justify-content: space-between;
  gap: var(--ebi-gap);
  padding: var(--space-2, 8px) 0;
  border-bottom: var(--border-width, 1px) solid var(--ebi-border);
}

/* A heading row with indented price-band rows under it. */
.ebi-pricing__row--group {
  padding-bottom: 0;
  border-bottom: 0;
}

.ebi-pricing__row--sub {
  padding-left: var(--ebi-gap);
  font-size: var(--ebi-text-small);
  color: var(--text-muted, #B8B8B8);
}

.ebi-pricing__row--total {
  border-bottom: 0;
  font-size: var(--ebi-text-large);
  font-weight: var(--fw-bold, 700);
  color: var(--ebi-total);
}
</style>
<section class="ebi-pricing" data-currency="EUR" data-locale="en-GB" aria-label="Page pricing estimate">
  <h3 class="ebi-pricing__title">Estimate your page package</h3>
  <div class="ebi-pricing__layout">
    <form class="ebi-pricing__form" novalidate>
      <label class="ebi-pricing__field">
        <span>Service categories <span class="ebi-pricing__hint">(0 if your services are not grouped)</span></span>
        <input type="number" name="categoryPages" min="0" max="500" step="1" value="0" inputmode="numeric">
      </label>
      <label class="ebi-pricing__field">
        <span>Service pages <span class="ebi-pricing__hint">(total, across all categories)</span></span>
        <input type="number" name="servicePages" min="0" max="500" step="1" value="5" inputmode="numeric">
      </label>
      <fieldset class="ebi-pricing__group">
        <legend class="ebi-pricing__legend">Location pages</legend>
        <div class="ebi-pricing__grid">
          <label class="ebi-pricing__field">
            <span>Cities</span>
            <input type="number" name="cities" min="0" max="500" step="1" value="2" inputmode="numeric">
          </label>
          <label class="ebi-pricing__field">
            <span>Districts</span>
            <input type="number" name="districts" min="0" max="500" step="1" value="4" inputmode="numeric">
          </label>
          <label class="ebi-pricing__field">
            <span>Neighborhoods</span>
            <input type="number" name="neighborhoods" min="0" max="500" step="1" value="0" inputmode="numeric">
          </label>
        </div>
      </fieldset>
      <fieldset class="ebi-pricing__group">
        <legend class="ebi-pricing__legend">
          Standard pages <span class="ebi-pricing__hint">(untick any your existing website already has)</span>
        </legend>
        <div class="ebi-pricing__cells">
          <label class="ebi-pricing__cell ebi-pricing__check">
            <input type="checkbox" name="home" checked>
            <span>Home</span>
          </label>
          <label class="ebi-pricing__cell ebi-pricing__check">
            <input type="checkbox" name="about" checked>
            <span>About us</span>
          </label>
          <label class="ebi-pricing__cell ebi-pricing__check">
            <input type="checkbox" name="privacy" checked>
            <span>Privacy policy</span>
          </label>
          <label class="ebi-pricing__cell ebi-pricing__check">
            <input type="checkbox" name="contact" checked>
            <span>Contact us</span>
          </label>
          <div class="ebi-pricing__cell ebi-pricing__cell--empty" aria-hidden="true"></div>
          <div class="ebi-pricing__cell ebi-pricing__cell--empty" aria-hidden="true"></div>
        </div>
      </fieldset>
    </form>
    <div class="ebi-pricing__result" aria-live="polite"></div>
  </div>
</section>
<script>
(function () {
  'use strict';

  // All money is integer cents. Change rules here, nowhere else.
  // CONFIRMED rates, except districts: no rate was given, so they are assumed to match the other pages.
  const RATES = {
    templateCents: 2500,
    // Optional pages (see STANDARD_PAGES) the visitor ticks when the site does not already have them.
    // Each is priced individually, so none is counted as a templated page.
    standardPageCents: 2500,
    // Projects priced below this are not taken on. The price is not topped up; the visitor is told instead.
    minimumCents: 50000,
    pageCents: {
      categories: 500,
      services: 500,
      cities: 500,
      districts: 500,
      neighborhoods: 500,
    },
    // Service-location pages are graduated: each page is charged at the rate of the tier it falls in.
    serviceLocation: [
      { upTo: 500, unitCents: 500 },
      { upTo: 1000, unitCents: 400 },
      { upTo: Infinity, unitCents: 300 },
    ],
    maxPages: 500,
  };

  const LOCATION_TYPES = [
    { key: 'cities', label: 'City pages' },
    { key: 'districts', label: 'District pages' },
    { key: 'neighborhoods', label: 'Neighborhood pages' },
  ];

  const STANDARD_PAGES = [
    { key: 'home', label: 'home' },
    { key: 'about', label: 'about us' },
    { key: 'privacy', label: 'privacy policy' },
    { key: 'contact', label: 'contact us' },
  ];

  // How many of the pages fall in each tier, and what they cost. Tiers that get no pages are left out.
  function tieredBreakdown(count, tiers) {
    const lines = [];
    let remaining = count;
    let previousLimit = 0;
    for (const { upTo, unitCents } of tiers) {
      const pages = Math.min(remaining, upTo - previousLimit);
      if (pages <= 0) break;
      lines.push({ pages, unitCents, cents: pages * unitCents });
      remaining -= pages;
      previousLimit = upTo;
    }
    return lines;
  }

  function tieredTotal(count, tiers) {
    return tieredBreakdown(count, tiers).reduce((total, line) => total + line.cents, 0);
  }

  function checkCount(name, value, maxPages) {
    if (!Number.isInteger(value) || value < 0 || value > maxPages) {
      throw new RangeError(name + ' must be a whole number from 0 to ' + maxPages);
    }
  }

  function countTemplates(hasServices, hasCategories, hasLocations) {
    let count = 0;
    if (hasServices) count += 2; // all-services + per-service
    if (hasCategories) count += 1; // service category
    if (hasLocations) count += 2; // all-locations + per-location, however many location types are used
    if ((hasServices || hasCategories) && hasLocations) count += 1; // service-location (covers category-location too)
    return count;
  }

  function calculatePrice(input, rates = RATES) {
    checkCount('servicePages', input.servicePages, rates.maxPages);
    checkCount('categoryPages', input.categoryPages, rates.maxPages);
    for (const { key } of LOCATION_TYPES) checkCount(key, input[key], rates.maxPages);

    const { pageCents } = rates;
    const servicesCents = input.servicePages * pageCents.services;
    const categoriesCents = input.categoryPages * pageCents.categories;

    const locations = {};
    let locationsCents = 0;
    let locationPages = 0;
    for (const { key } of LOCATION_TYPES) {
      locations[key] = input[key] * pageCents[key];
      locationsCents += locations[key];
      locationPages += input[key];
    }

    // Every service and every category gets a page on every location.
    const serviceLocationPages = (input.servicePages + input.categoryPages) * locationPages;
    const serviceLocationTiers = tieredBreakdown(serviceLocationPages, rates.serviceLocation);
    const serviceLocationCents = tieredTotal(serviceLocationPages, rates.serviceLocation);

    const templateCount = countTemplates(input.servicePages > 0, input.categoryPages > 0, locationPages > 0);
    const templatesCents = templateCount * rates.templateCents;
    // A missing standardPages input means none are wanted.
    const chosen = input.standardPages || {};
    const standardPageCount = STANDARD_PAGES.filter(({ key }) => chosen[key]).length;
    const standardPagesCents = standardPageCount * rates.standardPageCents;
    const totalCents =
      templatesCents + standardPagesCents + servicesCents + categoriesCents + locationsCents + serviceLocationCents;

    return {
      pages: input.servicePages + input.categoryPages + locationPages + serviceLocationPages,
      templates: { count: templateCount, cents: templatesCents },
      standardPages: { count: standardPageCount, cents: standardPagesCents },
      services: { cents: servicesCents },
      categories: { cents: categoriesCents },
      locations,
      serviceLocation: { pages: serviceLocationPages, cents: serviceLocationCents, tiers: serviceLocationTiers },
      totalCents,
      belowMinimum: totalCents < rates.minimumCents,
    };
  }

  function row(label, cents, format, className) {
    const li = document.createElement('li');
    li.className = 'ebi-pricing__row' + (className ? ' ' + className : '');
    const name = document.createElement('span');
    name.textContent = label;
    li.append(name);
    // A heading row (no amount of its own) passes null for cents.
    if (cents !== null) {
      const amount = document.createElement('span');
      amount.textContent = format.format(cents / 100);
      li.append(amount);
    }
    return li;
  }

  function init(rootEl) {
    const form = rootEl.querySelector('.ebi-pricing__form');
    const result = rootEl.querySelector('.ebi-pricing__result');
    const locale = rootEl.dataset.locale || 'en-GB';
    const format = new Intl.NumberFormat(locale, {
      style: 'currency',
      currency: rootEl.dataset.currency || 'EUR',
    });
    const numbers = new Intl.NumberFormat(locale);

    function render() {
      const els = form.elements;
      const counts = {
        servicePages: Number(els.servicePages.value),
        categoryPages: Number(els.categoryPages.value),
        cities: Number(els.cities.value),
        districts: Number(els.districts.value),
        neighborhoods: Number(els.neighborhoods.value),
      };
      const standardPages = {};
      for (const { key } of STANDARD_PAGES) standardPages[key] = els[key].checked;
      let price;
      try {
        price = calculatePrice({ ...counts, standardPages });
      } catch (err) {
        result.textContent = 'Enter whole numbers from 0 to ' + RATES.maxPages + '.';
        return;
      }

      const list = document.createElement('ul');
      list.className = 'ebi-pricing__rows';
      if (price.templates.count) {
        list.append(row('Templates (' + price.templates.count + ')', price.templates.cents, format));
      }
      if (price.standardPages.count) {
        const names = STANDARD_PAGES.filter(({ key }) => standardPages[key]).map(({ label }) => label);
        list.append(row('Standard pages (' + names.join(', ') + ')', price.standardPages.cents, format));
      }
      if (counts.categoryPages) {
        list.append(row('Service category pages (' + numbers.format(counts.categoryPages) + ')', price.categories.cents, format));
      }
      if (counts.servicePages) {
        list.append(row('Service pages (' + numbers.format(counts.servicePages) + ')', price.services.cents, format));
      }
      for (const { key, label } of LOCATION_TYPES) {
        if (counts[key]) {
          list.append(row(label + ' (' + numbers.format(counts[key]) + ')', price.locations[key], format));
        }
      }
      if (price.serviceLocation.pages) {
        const heading = 'Service-location pages (' + numbers.format(price.serviceLocation.pages) + ')';
        list.append(row(heading, null, format, 'ebi-pricing__row--group'));
        for (const tier of price.serviceLocation.tiers) {
          const label =
            numbers.format(tier.pages) + (tier.pages === 1 ? ' page at ' : ' pages at ') +
            format.format(tier.unitCents / 100);
          list.append(row(label, tier.cents, format, 'ebi-pricing__row--sub'));
        }
      }
      list.append(row('Estimated total', price.totalCents, format, 'ebi-pricing__row--total'));

      const summary = document.createElement('p');
      summary.className = 'ebi-pricing__summary';
      const standardNote = price.standardPages.count
        ? ', plus ' + price.standardPages.count + ' standard ' + (price.standardPages.count === 1 ? 'page' : 'pages')
        : '';
      summary.textContent = price.pages
        ? numbers.format(price.pages) + ' pages built from ' + price.templates.count + ' templates' + standardNote
        : 'Choose how many pages you need.';
      const children = [summary, list];
      if (price.belowMinimum) {
        const notice = document.createElement('p');
        notice.className = 'ebi-pricing__notice';
        notice.textContent =
          'Although the estimated price is ' + format.format(price.totalCents / 100) +
          ', we do not take on projects smaller than ' + format.format(RATES.minimumCents / 100) + '.';
        children.push(notice);
      }
      result.replaceChildren(...children);
    }

    form.addEventListener('input', render);
    render();
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { RATES, tieredBreakdown, tieredTotal, calculatePrice };
  }

  if (typeof document !== 'undefined') {
    document.querySelectorAll('.ebi-pricing:not([data-ebi-ready])').forEach(function (el) {
      el.setAttribute('data-ebi-ready', '');
      init(el);
    });
  }
})();
</script>
